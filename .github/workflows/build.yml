name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, to catch a new Ubuntu kernel that breaks the build before users get it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper dh-dkms lintian

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir dist
          mv ../*.deb dist/

      - name: Lint package
        run: lintian --fail-on error dist/*.deb

      - name: Install package, building the module for the runner kernel
        run: |
          sudo apt-get install -y "linux-headers-$(uname -r)" ./dist/*.deb
          dkms status -k "$(uname -r)" aic8800-tenda | grep installed

      - name: Build the module for the latest Ubuntu HWE kernel
        run: |
          # Installing headers may already trigger the build through the DKMS header hook.
          sudo apt-get install -y linux-headers-generic-hwe-24.04
          k=$(ls /usr/src | sed -n 's/^linux-headers-\(.*-generic\)$/\1/p' | sort -V | tail -1)
          if ! dkms status -k "$k" aic8800-tenda | grep -qE 'built|installed'; then
            sudo dkms build "aic8800-tenda/$(dpkg-parsechangelog -S Version)" -k "$k"
          fi
          dkms status -k "$k" aic8800-tenda | grep -E 'built|installed'

      - name: Show DKMS build log
        if: failure()
        run: cat /var/lib/dkms/aic8800-tenda/*/build/make.log || true

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, to catch a new Ubuntu kernel that breaks the build before users get it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dh-dkms lintian

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir dist
          mv ../*.deb dist/

      - name: Lint package
        run: lintian --fail-on error dist/*.deb

      # The runner's own (Azure) kernel has no headers installed, so DKMS only registers the module here.
      - name: Install package
        run: sudo apt-get install -y --no-install-recommends ./dist/*.deb

      # Desktop kernels users run: the 24.04 GA kernel and the latest HWE kernel. Installing their
      # headers triggers the DKMS build, as a kernel update does; build explicitly if it did not.
      - name: Build the module for Ubuntu 24.04 kernels
        run: |
          sudo apt-get install -y --no-install-recommends linux-headers-generic linux-headers-generic-hwe-24.04
          v=$(dpkg-parsechangelog -S Version)
          for k in $(ls /usr/src | sed -n 's/^linux-headers-\(.*-generic\)$/\1/p'); do
            st=$(dkms status -k "$k" aic8800-tenda)
            grep -qE 'built|installed' <<<"$st" || sudo dkms build "aic8800-tenda/$v" -k "$k"
            dkms status -k "$k" aic8800-tenda | grep -E 'built|installed'
          done

      - name: Show DKMS build log
        if: failure()
        run: sudo cat /var/lib/dkms/aic8800-tenda/*/build/make.log || true

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
